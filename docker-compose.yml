services:
  mysql:
    image: mysql:latest
    container_name: mysql-cont
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=flaskapp-db
    networks:
      - flaskapp-nw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  flask-app:
    build: .
    container_name: flask-app
    ports:
      - "8000:5000"
    networks:
      - flaskapp-nw
    environment:
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=flaskapp-db
    depends_on:
      mysql:
        condition: service_healthy

networks:
  flaskapp-nw:
volumes:
  mysql-data:
